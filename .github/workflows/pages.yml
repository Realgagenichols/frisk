name: pages

# Deploys the playground (R20): builds the detector-core bundle FROM SOURCE at deploy time
# (R23 — no committed copy can drift), then publishes site/ to GitHub Pages.
# One-time manual setup: repo Settings → Pages → Source = "GitHub Actions".
#
# The build runs on pull requests too, deploy does not. Without that, every action in this
# file was unreachable from PR CI: a Dependabot bump to configure-pages or
# upload-pages-artifact came back green having exercised nothing, because the only workflow
# that runs on a PR is ci.yml. A check whose green is guaranteed by WHEN it runs is not a
# check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped by ref so a pull-request build cannot cancel a real deploy in flight.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The playground ships the detector core to users' browsers, so it does not deploy from a
  # red suite. Duplicated rather than reached across workflows: `needs` cannot span them, and
  # a deploy gated on a job it cannot see is a gate in name only.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build detector-core bundle from source
        run: |
          python scripts/build_site.py
          test -s site/dist/frisk_core.zip
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    # Build on every PR, publish only from main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
